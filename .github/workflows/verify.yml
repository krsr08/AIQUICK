name: Verify synthetic slice
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -r config/requirements.lock
      - run: New-Item -ItemType Directory -Force work
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: python -m pip_audit --format json --output work/dependency-audit.json
      - run: python -m bandit -r backend/src policy_service demo_apps deployment scripts -ll -f json -o work/bandit.json
      - run: python scripts/check_secrets.py
      - run: python -m cyclonedx_py environment --of JSON -o work/sbom.json
      - run: python -m pytest -c config/pytest.ini backend/tests -v --junitxml=work/tests.xml
        env:
          PYTHONPATH: backend/src;.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: work/
